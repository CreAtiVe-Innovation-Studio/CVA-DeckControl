name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Volle requirements.txt statt einer Minimal-Liste: hidapi/pyusb
      # installieren auf ubuntu-latest problemlos ueber vorkompilierte Wheels
      # (verifiziert), und ein zweites, unabhaengiges Set haette genau das
      # Risiko, das den allerersten CI-Lauf hier gebrochen hat (ein Modul
      # importierte transitiv psutil/pyusb, die nicht in der Minimal-Liste
      # standen - siehe Commit-Historie).
      - run: pip install -r requirements.txt pytest
      - run: pytest -v
