<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>CVA-DeckControl</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg-0: #05070d;
    --bg-1: #0b1020;
    --panel: rgba(255,255,255,0.045);
    --panel-strong: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.18);
    --text: #e8ecf7;
    --text-dim: #8890a6;
    --accent: #38bdf8;
    --accent2: #a78bfa;
    --accent3: #34d399;
    --danger: #f87171;
    --radius: 16px;
    --radius-sm: 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    color: var(--text);
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(56,189,248,0.14), transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, rgba(167,139,250,0.12), transparent 55%),
      radial-gradient(900px 600px at 50% 120%, rgba(52,211,153,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0));
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
  }
  ::selection { background: rgba(56,189,248,0.35); }

  .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }

  .sidebar {
    padding: 22px 16px;
    border-right: 1px solid var(--border);
    background: rgba(6,9,18,0.55);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    display: flex;
    flex-direction: column;
    gap: 18px;
    height: 100vh;
    overflow-y: auto;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 6px 12px 6px;
    border-bottom: 1px solid var(--border);
  }
  .brand .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #7fe3ff, var(--accent));
    box-shadow: 0 0 14px rgba(56,189,248,0.8);
  }
  .brand h1 { font-size: 15px; font-weight: 650; letter-spacing: .01em; margin: 0; }
  .brand small { color: var(--text-dim); display: block; font-size: 11px; margin-top: 1px; }

  .nav-group { display: flex; flex-direction: column; gap: 4px; }
  .nav-group-title {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--text-dim); padding: 6px 10px 2px;
  }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 12px; border-radius: var(--radius-sm);
    cursor: pointer; font-size: 13.5px; color: var(--text);
    border: 1px solid transparent;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .nav-item:hover { background: var(--panel); border-color: var(--border); }
  .nav-item.active {
    background: linear-gradient(135deg, rgba(56,189,248,0.16), rgba(167,139,250,0.10));
    border-color: rgba(56,189,248,0.35);
  }
  .nav-item .swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .nav-item .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .nav-sub { padding-left: 14px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item-btns { display: flex; gap: 2px; flex-shrink: 0; opacity: 0; transition: opacity .12s ease; }
  .nav-item:hover .nav-item-btns { opacity: 1; }
  .nav-btn {
    width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; line-height: 1; color: var(--text-dim);
    background: rgba(255,255,255,0.06); border: 1px solid transparent;
    cursor: pointer;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.14); color: var(--text); }
  .nav-btn.add { color: var(--accent3); font-size: 13px; opacity: 1; }
  .nav-btn.danger:hover { background: rgba(248,113,113,0.2); color: #ffb4b0; }

  .main { padding: 26px 34px 60px; min-width: 0; height: 100vh; overflow-y: auto; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; gap: 16px; flex-wrap: wrap;
  }
  .crumbs { font-size: 13px; color: var(--text-dim); }
  .crumbs b { color: var(--text); font-weight: 600; }
  .actions { display: flex; gap: 10px; align-items: center; }

  button {
    font-family: inherit; font-size: 13px; font-weight: 560;
    color: var(--text); background: var(--panel);
    border: 1px solid var(--border-strong);
    padding: 9px 16px; border-radius: 999px; cursor: pointer;
    transition: transform .12s ease, background .15s ease, box-shadow .15s ease, border-color .15s ease;
    backdrop-filter: blur(10px);
  }
  button:hover { background: var(--panel-strong); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.primary {
    background: linear-gradient(135deg, #22b3f0, #7c6cf0);
    border-color: transparent; color: #04101c; font-weight: 650;
    box-shadow: 0 6px 22px -8px rgba(56,189,248,0.6);
  }
  button.primary:hover { box-shadow: 0 8px 26px -6px rgba(56,189,248,0.75); }
  button.ghost { background: transparent; border-color: var(--border); }
  button.danger { border-color: rgba(248,113,113,0.35); color: #ffb4b0; }
  button.small { padding: 6px 12px; font-size: 12px; }
  button:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .grid-wrap { padding: 22px; }
  .keygrid {
    display: grid;
    grid-template-columns: repeat(var(--cols, 5), 84px);
    gap: 12px;
  }
  .key {
    width: 84px; height: 84px; border-radius: 14px;
    border: 1px solid var(--border);
    background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative; overflow: hidden;
    transition: transform .12s ease, border-color .15s ease, box-shadow .15s ease;
    padding: 6px;
    text-align: center;
  }
  .key:hover { transform: translateY(-2px) scale(1.03); border-color: rgba(56,189,248,0.5); box-shadow: 0 10px 24px -10px rgba(56,189,248,0.4); }
  .key.empty { opacity: .35; border-style: dashed; }
  .key .icon-dot {
    width: 26px; height: 26px; border-radius: 8px; margin-bottom: 6px;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .key .ttl { font-size: 10px; line-height: 1.25; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .key .idx { position: absolute; top: 4px; left: 6px; font-size: 8.5px; color: rgba(255,255,255,0.25); }

  .type-hotkey { background: rgba(255,196,74,0.16); color: #ffc44a; }
  .type-open, .type-open_sequence { background: rgba(52,211,153,0.16); color: #34d399; }
  .type-website { background: rgba(56,189,248,0.16); color: #38bdf8; }
  .type-switch_profile { background: rgba(167,139,250,0.18); color: #a78bfa; }
  .type-page_next, .type-page_previous { background: rgba(148,163,184,0.16); color: #94a3b8; }
  .type-live_stat, .type-ha_sensor { background: rgba(56,189,248,0.16); color: #38bdf8; }
  .type-ha_toggle, .type-ha_cover { background: rgba(52,211,153,0.16); color: #34d399; }
  .type-app_volume { background: rgba(56,189,248,0.14); color: #38bdf8; }
  .type-timer { background: rgba(56,189,248,0.2); color: #7fe3ff; }
  .type-live_view_toggle { background: rgba(52,211,153,0.18); color: #34d399; }
  .type-open_gui { background: rgba(148,163,184,0.2); color: #cbd5e1; }
  .type-unmapped { background: rgba(248,113,113,0.16); color: #f87171; }
  .type-none { background: rgba(255,255,255,0.06); color: var(--text-dim); }

  .empty-state { padding: 60px 20px; text-align: center; color: var(--text-dim); }
  .empty-state h2 { color: var(--text); font-size: 17px; margin-bottom: 6px; }

  /* Editor drawer */
  .overlay {
    position: fixed; inset: 0; background: rgba(2,4,10,0.55);
    backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
    z-index: 40;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 420px; max-width: 92vw;
    background: rgba(9,12,22,0.86);
    border-left: 1px solid var(--border-strong);
    backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px);
    transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.9,.25,1);
    z-index: 50; display: flex; flex-direction: column;
    box-shadow: -20px 0 60px -20px rgba(0,0,0,0.6);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    padding: 20px 22px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .drawer-head h3 { margin: 0; font-size: 15px; }
  .drawer-body { padding: 18px 22px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  .drawer-foot { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: space-between; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); }
  input[type=text], input[type=number], select, textarea {
    font-family: inherit; font-size: 13.5px; color: var(--text);
    background: rgba(255,255,255,0.045);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 10px 12px; outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  textarea { min-height: 78px; resize: vertical; font-family: ui-monospace, monospace; font-size: 12.5px; }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent); background: rgba(56,189,248,0.06);
    box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
  }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%); background-position: calc(100% - 16px) center, calc(100% - 11px) center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
  .checkline { display: flex; align-items: center; gap: 8px; }
  .checkline input { width: 16px; height: 16px; }
  .checkline label { text-transform: none; font-size: 13px; color: var(--text); }
  .hint { font-size: 11px; color: var(--text-dim); }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  .icon-preview { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); }
  .subcard { border: 1px dashed var(--border); border-radius: var(--radius-sm); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .subcard-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(10,14,26,0.92); border: 1px solid var(--border-strong);
    padding: 12px 20px; border-radius: 999px; font-size: 13px;
    backdrop-filter: blur(16px); opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease; z-index: 60;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.6);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { border-color: rgba(52,211,153,0.4); }
  .toast.err { border-color: rgba(248,113,113,0.4); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="dot"></div>
      <div>
        <h1>CVA-DeckControl</h1>
        <small>Elgato Mini + DECK ONE</small>
      </div>
    </div>
    <div id="nav"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="crumbs" id="crumbs">Waehle eine Seite links aus</div>
      <div class="actions">
        <button class="ghost small" id="btn-restart">Treiber neu starten</button>
        <button class="primary" id="btn-save">Speichern</button>
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3 id="drawer-title">Taste bearbeiten</h3>
    <button class="ghost small" id="drawer-close">Schliessen</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot">
    <button class="danger small" id="drawer-clear">Taste leeren</button>
    <button class="primary" id="drawer-apply">Uebernehmen</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const state = { config: null, profiles: [], actionSchema: {}, iconSchema: {}, sounds: [], current: null };
let editing = null; // { keys, idx, key }

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of [].concat(children)) if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  return e;
}

function toast(msg, kind = "ok") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + kind;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2600);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || res.statusText);
  return data;
}

async function loadAll() {
  const data = await api("/api/config");
  state.config = data.config;
  state.profiles = data.profiles;
  state.actionSchema = data.action_schema;
  state.iconSchema = data.icon_schema;
  try { state.sounds = (await api("/api/sounds")).sounds; } catch (e) {}
  renderNav();
}

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";

  const elgatoGroup = el("div", { class: "nav-group" }, [
    el("div", { class: "nav-group-title" }, [
      "Elgato Mini",
      navBtn("+", "Neue Elgato-Seite", addElgatoPage, "add"),
    ]),
  ]);
  const elgatoPages = state.config.elgato?.pages || {};
  for (const pname of Object.keys(elgatoPages)) {
    elgatoGroup.appendChild(navItem(pname, "#38bdf8", () => selectPage("elgato", pname, null), false, [
      navBtn("✎", "Seite umbenennen", () => renameElgatoPage(pname)),
      navBtn("✕", "Seite loeschen", () => deleteElgatoPage(pname), "danger"),
    ]));
  }
  nav.appendChild(elgatoGroup);

  const deckGroup = el("div", { class: "nav-group" }, [
    el("div", { class: "nav-group-title" }, [
      "DECK ONE Profile",
      navBtn("+", "Neues Profil", addDeckoneProfile, "add"),
    ]),
  ]);
  const profiles = state.config.deckone?.profiles || {};
  for (const [pname, pdata] of Object.entries(profiles)) {
    const color = pdata.color || "#94a3b8";
    const item = navItem(pname, color, () => toggleProfile(pname), false, [
      navBtn("+", "Seite hinzufuegen", (e) => { e.stopPropagation(); addDeckonePage(pname); }),
      navBtn("✎", "Profil umbenennen", (e) => { e.stopPropagation(); renameDeckoneProfile(pname); }),
      navBtn("✕", "Profil loeschen", (e) => { e.stopPropagation(); deleteDeckoneProfile(pname); }, "danger"),
    ]);
    const sub = el("div", { class: "nav-sub", id: "sub-" + cssSafe(pname), style: "display:none" });
    (pdata.pages || []).forEach((page, i) => {
      sub.appendChild(navItem(page.name || ("Seite " + (i + 1)), color, () => selectPage("deckone", pname, i), true, [
        navBtn("✎", "Seite umbenennen", (e) => { e.stopPropagation(); renameDeckonePage(pname, i); }),
        navBtn("✕", "Seite loeschen", (e) => { e.stopPropagation(); deleteDeckonePage(pname, i); }, "danger"),
      ]));
    });
    deckGroup.appendChild(item);
    deckGroup.appendChild(sub);
  }
  nav.appendChild(deckGroup);
}

function cssSafe(s) { return s.replace(/[^a-z0-9]/gi, "_"); }

function navBtn(glyph, title, onClick, extraClass = "") {
  return el("span", { class: "nav-btn " + extraClass, title, onclick: (e) => { e.stopPropagation(); onClick(e); } }, glyph);
}

function navItem(label, color, onClick, small = false, extraBtns = []) {
  const item = el("div", { class: "nav-item", onclick: onClick }, [
    el("span", { class: "label" }, [el("span", { class: "swatch", style: `background:${color}` }), " " + label]),
    el("div", { class: "nav-item-btns" }, extraBtns),
  ]);
  item.style.fontSize = small ? "12.5px" : "13.5px";
  return item;
}

function toggleProfile(pname) {
  const sub = document.getElementById("sub-" + cssSafe(pname));
  if (sub) sub.style.display = sub.style.display === "none" ? "flex" : "none";
}

function expandProfile(pname) {
  const sub = document.getElementById("sub-" + cssSafe(pname));
  if (sub) sub.style.display = "flex";
}

function resetContent() {
  state.current = null;
  document.getElementById("content").innerHTML = "";
  document.getElementById("crumbs").textContent = "Waehle eine Seite links aus";
}

// -- Seiten-/Profil-Verwaltung --------------------------------------------

function addElgatoPage() {
  const id = (prompt("Interner Seiten-Key (z.B. modi_extra, keine Leerzeichen/Umlaute):") || "").trim();
  if (!id) return;
  state.config.elgato = state.config.elgato || { pages: {} };
  state.config.elgato.pages = state.config.elgato.pages || {};
  if (state.config.elgato.pages[id]) { toast("Seite existiert bereits", "err"); return; }
  state.config.elgato.pages[id] = { keys: {} };
  toast("Elgato-Seite angelegt - fuer Erreichbarkeit page_next/previous-Taste ergaenzen (noch nicht gespeichert)");
  renderNav();
}

function renameElgatoPage(pname) {
  const newId = (prompt("Neuer interner Key fuer Seite '" + pname + "':", pname) || "").trim();
  if (!newId || newId === pname) return;
  if (state.config.elgato.pages[newId]) { toast("Ziel-Key existiert bereits", "err"); return; }
  state.config.elgato.pages[newId] = state.config.elgato.pages[pname];
  delete state.config.elgato.pages[pname];
  if (state.current?.device === "elgato" && state.current.pageName === pname) resetContent();
  toast("Seite umbenannt (noch nicht gespeichert)");
  renderNav();
}

function deleteElgatoPage(pname) {
  if (!confirm(`Elgato-Seite '${pname}' wirklich loeschen?`)) return;
  delete state.config.elgato.pages[pname];
  if (state.current?.device === "elgato" && state.current.pageName === pname) resetContent();
  toast("Seite geloescht (noch nicht gespeichert)");
  renderNav();
}

function addDeckoneProfile() {
  const id = (prompt("Interner Profil-Key (z.B. buero, keine Leerzeichen/Umlaute):") || "").trim();
  if (!id) return;
  state.config.deckone = state.config.deckone || { profiles: {} };
  state.config.deckone.profiles = state.config.deckone.profiles || {};
  if (state.config.deckone.profiles[id]) { toast("Profil existiert bereits", "err"); return; }
  const color = (prompt("Farbe (Hex, z.B. #38BDF8):", "#38BDF8") || "#94a3b8").trim();
  const pageName = (prompt("Anzeigename der ersten Seite:", "Seite 1") || "Seite 1").trim();
  state.config.deckone.profiles[id] = { color, pages: [{ name: pageName, keys: {} }] };
  state.profiles = Object.keys(state.config.deckone.profiles);
  toast("Profil angelegt - fuer Erreichbarkeit eine switch_profile-Taste auf einer Elgato-Seite anlegen (noch nicht gespeichert)");
  renderNav();
}

function renameDeckoneProfile(oldName) {
  const newName = (prompt("Neuer interner Profil-Key:", oldName) || "").trim();
  if (!newName || newName === oldName) return;
  if (state.config.deckone.profiles[newName]) { toast("Ziel-Key existiert bereits", "err"); return; }
  state.config.deckone.profiles[newName] = state.config.deckone.profiles[oldName];
  delete state.config.deckone.profiles[oldName];
  let updated = 0;
  for (const page of Object.values(state.config.elgato?.pages || {})) {
    for (const key of Object.values(page.keys || {})) {
      if (key?.action?.type === "switch_profile" && key.action.profile === oldName) { key.action.profile = newName; updated++; }
    }
  }
  state.profiles = Object.keys(state.config.deckone.profiles);
  if (state.current?.device === "deckone" && state.current.profile === oldName) resetContent();
  toast(`Profil umbenannt${updated ? `, ${updated} switch_profile-Taste(n) aktualisiert` : ""} (noch nicht gespeichert)`);
  renderNav();
}

function deleteDeckoneProfile(pname) {
  const refs = [];
  for (const [ename, page] of Object.entries(state.config.elgato?.pages || {})) {
    for (const [idx, key] of Object.entries(page.keys || {})) {
      if (key?.action?.type === "switch_profile" && key.action.profile === pname) refs.push(`${ename}#${idx}`);
    }
  }
  const warn = refs.length ? `\n\nAchtung: ${refs.length} switch_profile-Taste(n) zeigen noch auf dieses Profil (${refs.join(", ")}) und laufen danach ins Leere.` : "";
  if (!confirm(`Profil '${pname}' wirklich loeschen?${warn}`)) return;
  delete state.config.deckone.profiles[pname];
  state.profiles = Object.keys(state.config.deckone.profiles);
  if (state.current?.device === "deckone" && state.current.profile === pname) resetContent();
  toast("Profil geloescht (noch nicht gespeichert)");
  renderNav();
}

function addDeckonePage(profileName) {
  const pdata = state.config.deckone.profiles[profileName];
  const name = prompt("Anzeigename der neuen Seite:", "Seite " + (pdata.pages.length + 1));
  if (name === null) return;
  pdata.pages.push({ name: name || ("Seite " + (pdata.pages.length + 1)), keys: {} });

  const setIfFree = (page, idx, type) => {
    if (page.keys[idx]) return false;
    page.keys[idx] = { name: type, title: "", action: { type }, icon: { type: "generated" } };
    return true;
  };
  let wired = true;
  if (pdata.pages.length === 2) {
    wired = setIfFree(pdata.pages[0], 14, "page_next") && setIfFree(pdata.pages[1], 14, "page_previous");
  } else {
    pdata.pages.forEach(p => {
      wired = setIfFree(p, 13, "page_previous") && wired;
      wired = setIfFree(p, 14, "page_next") && wired;
    });
  }
  toast(wired
    ? "Seite angelegt, Navigation automatisch verdrahtet (noch nicht gespeichert)"
    : "Seite angelegt - Navigations-Tasten (13/14) waren teils belegt, bitte pruefen (noch nicht gespeichert)");
  renderNav();
  expandProfile(profileName);
}

function renameDeckonePage(profileName, pageIndex) {
  const page = state.config.deckone.profiles[profileName].pages[pageIndex];
  const name = prompt("Neuer Anzeigename:", page.name || "");
  if (name === null) return;
  page.name = name;
  if (state.current?.device === "deckone" && state.current.profile === profileName && state.current.pageIndex === pageIndex) {
    document.getElementById("crumbs").innerHTML = `<b>DECK ONE</b> &rsaquo; ${profileName} &rsaquo; ${name}`;
  }
  toast("Seite umbenannt (noch nicht gespeichert)");
  renderNav();
  expandProfile(profileName);
}

function deleteDeckonePage(profileName, pageIndex) {
  const pdata = state.config.deckone.profiles[profileName];
  if (pdata.pages.length <= 1) { toast("Letzte Seite eines Profils kann nicht geloescht werden", "err"); return; }
  if (!confirm(`Seite '${pdata.pages[pageIndex].name || pageIndex}' wirklich loeschen?`)) return;
  pdata.pages.splice(pageIndex, 1);
  if (state.current?.device === "deckone" && state.current.profile === profileName) resetContent();
  toast("Seite geloescht (noch nicht gespeichert)");
  renderNav();
  expandProfile(profileName);
}

function selectPage(device, profileOrPageName, pageIndex) {
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  event?.currentTarget?.classList.add("active");

  let keys, title, cols;
  if (device === "elgato") {
    keys = state.config.elgato.pages[profileOrPageName].keys;
    title = `<b>Elgato Mini</b> &rsaquo; ${profileOrPageName}`;
    cols = 6;
    state.current = { device: "elgato", pageName: profileOrPageName };
  } else {
    const page = state.config.deckone.profiles[profileOrPageName].pages[pageIndex];
    keys = page.keys;
    title = `<b>DECK ONE</b> &rsaquo; ${profileOrPageName} &rsaquo; ${page.name || "Seite " + (pageIndex + 1)}`;
    cols = 5;
    state.current = { device: "deckone", profile: profileOrPageName, pageIndex };
  }
  document.getElementById("crumbs").innerHTML = title;
  renderKeyGrid(keys, cols);
}

function renderKeyGrid(keys, cols) {
  const content = document.getElementById("content");
  content.innerHTML = "";
  const wrap = el("div", { class: "card grid-wrap" });
  const grid = el("div", { class: "keygrid" });
  grid.style.setProperty("--cols", cols);
  const numKeys = cols === 6 ? 6 : 15;
  for (let i = 0; i < numKeys; i++) {
    const key = keys[i];
    const actionType = key?.action?.type || "none";
    const tile = el("div", { class: "key" + (key ? "" : " empty"), onclick: () => openEditor(keys, i, key) }, [
      el("span", { class: "idx" }, String(i)),
      el("div", { class: "icon-dot type-" + actionType }, glyphFor(actionType)),
      el("div", { class: "ttl" }, key ? (key.title || key.name || actionType) : "leer"),
    ]);
    grid.appendChild(tile);
  }
  wrap.appendChild(grid);
  content.appendChild(wrap);
}

function glyphFor(type) {
  const map = {
    hotkey: "⌨", open: "▸", open_sequence: "▸▸", website: "🌐", switch_profile: "⇄",
    page_next: "›", page_previous: "‹", live_stat: "◔", ha_sensor: "◔", ha_toggle: "⏻",
    ha_cover: "▤", app_volume: "🔊", timer: "◷", live_view_toggle: "📺", open_gui: "⚙", unmapped: "?", none: "+",
  };
  return map[type] || "•";
}

// -- Editor drawer -----------------------------------------------------

function openEditor(keys, idx, key) {
  editing = { keys, idx, key: key ? JSON.parse(JSON.stringify(key)) : null };
  const overlay = document.getElementById("overlay");
  const drawer = document.getElementById("drawer");
  overlay.classList.add("open");
  drawer.classList.add("open");
  document.getElementById("drawer-title").textContent = `Taste ${idx}`;
  renderEditorForm();
  overlay.onclick = closeEditor;
  document.getElementById("drawer-close").onclick = closeEditor;
}

function closeEditor() {
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("drawer").classList.remove("open");
  editing = null;
}

function collectAllKeys() {
  const out = [];
  const elgatoPages = state.config.elgato?.pages || {};
  for (const [pname, page] of Object.entries(elgatoPages)) {
    for (const key of Object.values(page.keys || {})) {
      if (!key?.action?.type) continue;
      out.push({ label: `Elgato Mini / ${pname} / ${key.title || key.name || key.action.type}`, key });
    }
  }
  const profiles = state.config.deckone?.profiles || {};
  for (const [pname, pdata] of Object.entries(profiles)) {
    (pdata.pages || []).forEach((page, pi) => {
      for (const key of Object.values(page.keys || {})) {
        if (!key?.action?.type) continue;
        out.push({ label: `${pname} / ${page.name || "Seite " + (pi + 1)} / ${key.title || key.name || key.action.type}`, key });
      }
    });
  }
  out.sort((a, b) => a.label.localeCompare(b.label));
  return out;
}

function templatePicker(k) {
  const templates = collectAllKeys();
  if (!templates.length) return null;
  const wrap = el("div", { class: "field" }, [el("label", {}, "Von bestehender Taste uebernehmen")]);
  const select = el("select", {}, [
    el("option", { value: "" }, "-- Vorlage waehlen --"),
    ...templates.map((t, i) => el("option", { value: String(i) }, t.label)),
  ]);
  select.addEventListener("change", () => {
    if (select.value === "") return;
    const src = templates[Number(select.value)].key;
    k.action = JSON.parse(JSON.stringify(src.action || { type: "" }));
    k.icon = JSON.parse(JSON.stringify(src.icon || { type: "generated" }));
    if (!k.title) k.title = src.title || "";
    if (!k.name) k.name = src.name || "";
    renderEditorForm();
  });
  wrap.appendChild(select);
  wrap.appendChild(el("div", { class: "hint" }, "Uebernimmt Aktion + Icon der gewaehlten Taste als Ausgangspunkt - danach frei anpassbar, aendert die Vorlage selbst nicht."));
  return wrap;
}

function renderEditorForm() {
  const body = document.getElementById("drawer-body");
  body.innerHTML = "";
  const k = editing.key || { name: "", title: "", action: { type: "" }, icon: { type: "generated" } };
  k.action = k.action || { type: "" };
  k.icon = k.icon || { type: "generated" };

  const picker = templatePicker(k);
  if (picker) body.appendChild(picker);

  body.appendChild(fieldText("Titel (sichtbar)", "title", k.title || "", v => k.title = v));
  body.appendChild(fieldText("Interner Name", "name", k.name || "", v => k.name = v));

  const actionTypes = Object.keys(state.actionSchema);
  const actionSelect = fieldSelect("Aktions-Typ", actionTypes, k.action.type || "", v => {
    k.action = { type: v };
    renderEditorForm();
  });
  body.appendChild(actionSelect);

  const schema = state.actionSchema[k.action.type] || [];
  if (schema.length) {
    const sub = el("div", { class: "subcard" }, [el("div", { class: "subcard-title" }, "Aktions-Details")]);
    schema.forEach(f => sub.appendChild(actionField(f, k.action)));
    body.appendChild(sub);
  }

  const iconTypes = Object.keys(state.iconSchema);
  body.appendChild(fieldSelect("Icon-Typ", iconTypes, k.icon.type || "generated", v => {
    k.icon = { type: v };
    renderEditorForm();
  }));
  const iconSchema = state.iconSchema[k.icon.type] || [];
  if (iconSchema.length) {
    const sub = el("div", { class: "subcard" }, [el("div", { class: "subcard-title" }, "Icon-Details")]);
    iconSchema.forEach(f => sub.appendChild(actionField(f, k.icon)));
    if (k.icon.path) {
      sub.appendChild(el("img", { class: "icon-preview", src: "/api/asset?path=" + encodeURIComponent(k.icon.path), onerror: e => e.target.style.display = "none" }));
    }
    body.appendChild(sub);
  }

  editing.key = k;
  document.getElementById("drawer-apply").onclick = applyEditor;
  document.getElementById("drawer-clear").onclick = clearEditor;
}

function fieldText(label, name, value, onChange) {
  const input = el("input", { type: "text", value });
  input.addEventListener("input", () => onChange(input.value));
  return el("div", { class: "field" }, [el("label", {}, label), input]);
}

function fieldSelect(label, options, value, onChange) {
  const select = el("select", {}, [
    el("option", { value: "" }, "-- waehlen --"),
    ...options.map(o => el("option", { value: o, ...(o === value ? { selected: "selected" } : {}) }, o)),
  ]);
  select.value = value;
  select.addEventListener("change", () => onChange(select.value));
  return el("div", { class: "field" }, [el("label", {}, label), select]);
}

function actionField(f, target) {
  const value = target[f.name];
  if (f.type === "bool") {
    const input = el("input", { type: "checkbox" });
    input.checked = !!value;
    input.addEventListener("change", () => target[f.name] = input.checked);
    return el("div", { class: "checkline" }, [input, el("label", {}, f.label)]);
  }
  if (f.type === "number") {
    const input = el("input", { type: "number", value: value ?? "" });
    input.addEventListener("input", () => target[f.name] = input.value === "" ? null : Number(input.value));
    return el("div", { class: "field" }, [el("label", {}, f.label), input]);
  }
  if (f.type === "select") {
    return fieldSelect(f.label, f.options, value || "", v => target[f.name] = v);
  }
  if (f.type === "profile_select") {
    return fieldSelect(f.label, state.profiles, value || "", v => target[f.name] = v);
  }
  if (f.type === "steps") {
    const text = (value || []).map(s => s.linux_command || "").join("\n");
    const ta = el("textarea", {}, text);
    ta.addEventListener("input", () => {
      target[f.name] = ta.value.split("\n").map(s => s.trim()).filter(Boolean).map(cmd => ({ linux_command: cmd }));
    });
    return el("div", { class: "field" }, [el("label", {}, f.label), ta]);
  }
  if (f.type === "readonly") {
    return el("div", { class: "field" }, [el("label", {}, f.label), el("div", { class: "hint" }, String(value || "-"))]);
  }
  if (f.type === "sound") {
    return soundField(f, target);
  }
  return fieldText(f.label, f.name, value || "", v => target[f.name] = v);
}

function soundField(f, target) {
  const wrap = el("div", { class: "field" }, [el("label", {}, f.label)]);
  const options = ["default", ...state.sounds];
  const current = target[f.name] || "default";
  const select = el("select", {}, options.map(o =>
    el("option", { value: o, ...(o === current ? { selected: "selected" } : {}) }, o === "default" ? "Standard-Ton" : o)));
  select.value = current;
  select.addEventListener("change", () => target[f.name] = select.value);
  wrap.appendChild(select);

  const row = el("div", { class: "row" });
  const playBtn = el("button", { class: "small", type: "button" }, "▶ Testen");
  playBtn.addEventListener("click", () => {
    const path = select.value === "default" ? "assets/sounds/timer_default.wav" : select.value;
    new Audio("/api/asset?path=" + encodeURIComponent(path)).play().catch(() => toast("Konnte Ton nicht abspielen", "err"));
  });
  row.appendChild(playBtn);

  const fileInput = el("input", { type: "file", accept: "audio/*", style: "display:none" });
  const uploadBtn = el("button", { class: "small", type: "button" }, "Datei hochladen");
  uploadBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const buf = await file.arrayBuffer();
    const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
    try {
      const res = await api("/api/upload-sound", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename: file.name, data_base64: b64 }),
      });
      state.sounds.push(res.path);
      target[f.name] = res.path;
      renderEditorForm();
      toast("Sound hochgeladen");
    } catch (e) { toast("Upload fehlgeschlagen: " + e.message, "err"); }
  });
  row.appendChild(uploadBtn);
  row.appendChild(fileInput);
  wrap.appendChild(row);
  return wrap;
}

function applyEditor() {
  const { keys, idx, key } = editing;
  if (!key.action.type) { toast("Bitte einen Aktions-Typ waehlen", "err"); return; }
  keys[idx] = key;
  closeEditor();
  refreshCurrentView();
  toast("Uebernommen (noch nicht gespeichert)");
}

function clearEditor() {
  const { keys, idx } = editing;
  delete keys[idx];
  closeEditor();
  refreshCurrentView();
  toast("Taste geleert (noch nicht gespeichert)");
}

function refreshCurrentView() {
  if (!state.current) return;
  if (state.current.device === "elgato") selectPageNoEvent("elgato", state.current.pageName, null);
  else selectPageNoEvent("deckone", state.current.profile, state.current.pageIndex);
}
function selectPageNoEvent(device, a, b) {
  let keys, cols;
  if (device === "elgato") { keys = state.config.elgato.pages[a].keys; cols = 6; }
  else { keys = state.config.deckone.profiles[a].pages[b].keys; cols = 5; }
  renderKeyGrid(keys, cols);
}

// -- Global actions ------------------------------------------------------

document.getElementById("btn-save").addEventListener("click", async () => {
  try {
    await api("/api/config", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ config: state.config }),
    });
    toast("Gespeichert. Fuer Wirkung: Treiber neu starten.");
  } catch (e) { toast("Speichern fehlgeschlagen: " + e.message, "err"); }
});

document.getElementById("btn-restart").addEventListener("click", async () => {
  try {
    await api("/api/restart", { method: "POST" });
    toast("Treiber neu gestartet");
  } catch (e) { toast("Neustart fehlgeschlagen: " + e.message, "err"); }
});

loadAll().catch(e => toast("Laden fehlgeschlagen: " + e.message, "err"));
</script>
