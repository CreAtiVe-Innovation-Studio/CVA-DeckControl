# Beispiel-Konfiguration - zeigt die wichtigsten Aktions-/Icon-Typen anhand
# eines kompakten, frei erfundenen Setups. Das ist NICHT die echte
# profiles.yaml von irgendjemandem (die ist per .gitignore ausgeschlossen)
# - kopieren, umbenennen zu profiles.yaml, nach eigenem Bedarf umbauen.
#
# Volle Feld-Referenz + Kochrezepte fuer neue Tasten/Seiten/Profile: siehe
# SEITEN-LOGIK.md.
# Automatischer DECK-ONE-Profilwechsel je nach aktiver App - komplett optional,
# siehe SEITEN-LOGIK.md Abschnitt 4.13. Ohne diesen Block (oder enabled: false)
# passiert nichts anders als vorher. Schluessel unter 'apps' sind Teilstrings
# der App-Kennung (wm_class unter Linux, Prozessname unter Windows, App-Name
# unter macOS), klein geschrieben, Teilstring-Vergleich.
auto_profile_switch:
  enabled: false
  poll_interval_s: 3
  apps:
    obs: streaming
    firefox: buero
# Fenster-Layout - komplett optional, siehe SEITEN-LOGIK.md Abschnitt 4.14.
# Positionen sind Anteile (0..1) der Arbeitsflaeche des jeweiligen Monitors.
# Am einfachsten aufnehmen: Fenster hinschieben, dann
#   python tools/capture_layout.py --name unterricht
# Passt die Prozessnamen (match.process) und Startbefehle an das eigene System an.
window_layouts:
  unterricht:
    start_timeout_s: 30
    services:                       # nur gestartet, wenn der Port noch nicht belegt ist
      - name: lokaler-server
        port: 8080
        command: {windows: 'C:\tools\start-server.bat', linux: '/opt/server/start.sh'}
    apps:
      browser_links:                # 1. Firefox-Fenster (von links nach rechts), ganzer linker Monitor
        match: {process: [firefox], order: 0}
        slot: {monitor: left, x: 0, y: 0, w: 1, h: 1}
        launch: {windows: 'C:\Program Files\Mozilla Firefox\firefox.exe', linux: firefox}
        start: true
      browser_rechts:               # 2. Firefox-Fenster, rechte Haelfte des rechten Monitors
        match: {process: [firefox], order: 1}
        slot: {monitor: right, x: 0.5, y: 0, w: 0.5, h: 1}
        launch_with: browser_links  # Firefox stellt beide Fenster selbst wieder her
        start: true
      chat:
        match: {process: [teams, ms-teams]}
        slot: {monitor: right, x: 0, y: 0, w: 0.22, h: 1}
        launch_uri: 'msteams:'
        start: true
      bilder:                       # nicht vom Start geoeffnet, aber positioniert, wenn man es selbst oeffnet
        match: {process: [photos, eog]}
        slot: {monitor: right, x: 0.42, y: 0, w: 0.58, h: 0.82}
        auto_place: true
      pdf:
        match: {process: [msedge, evince], title: '\.pdf'}
        slot: {monitor: right, x: 0.45, y: 0, w: 0.55, h: 0.85}
        auto_place: true
version: 1
elgato:
  pages:
    modi:
      keys:
        0:
          name: Open
          title: Buero
          action:
            type: switch_profile
            profile: buero
          icon:
            type: generated
        1:
          name: Open
          title: Musik
          action:
            type: switch_profile
            profile: musik
          icon:
            type: generated
        2:
          name: Open
          title: Farbschema
          action:
            type: switch_profile
            profile: farbschema
          icon:
            type: generated
        5:
          name: Naechste Seite
          title: ''
          action:
            type: page_next
          icon:
            type: generated
deckone:
  active_profile: buero
  profiles:
    buero:
      color: '#0078D4'
      pages:
      - name: Buero
        keys:
          0:
            name: Firefox
            title: Firefox
            action:
              type: open
              linux_command: firefox
            icon:
              type: generated
          1:
            name: Copy
            title: ''
            action:
              type: hotkey
              vkeycode: 67
              ctrl: true
              shift: false
              alt: false
            icon:
              type: generated
          2:
            name: Docs
            title: Docs
            action:
              type: website
              url: https://docs.google.com
            icon:
              type: generated
          3:
            name: CPU
            title: CPU
            action:
              type: live_stat
              metric: cpu
            icon:
              type: generated
          4:
            name: Pomodoro
            title: Pomodoro 25min
            action:
              type: timer
              duration_min: 25
              sound: default
              style: digital
            icon:
              type: generated
          5:
            name: Live-Ansicht
            title: Live-Ansicht
            action:
              type: live_view_toggle
            icon:
              type: generated
          6:
            name: Licht
            title: Licht Buero
            action:
              type: ha_toggle
              entity_id: light.buero
            icon:
              type: generated
          7:
            name: Einstellungen
            title: Einstellungen
            action:
              type: open_gui
            action_long:    # optional - siehe SEITEN-LOGIK.md Abschnitt 4.12
              type: website
              url: https://example.com
            icon:
              type: generated
          8:
            name: Vorhersage
            title: Morgen
            action:
              type: weather_forecast
              entity_id: weather.home
              forecast_type: daily
              offset: 1
            icon:
              type: generated
    musik:
      color: '#00C851'
      pages:
      - name: Musik
        keys:
          0:
            name: Lautstaerke +
            title: Vol +
            action:
              type: app_volume
              app_name: spotify
              direction: up
            icon:
              type: generated
          1:
            name: Lautstaerke -
            title: Vol -
            action:
              type: app_volume
              app_name: spotify
              direction: down
            icon:
              type: generated
    # Kochrezept "mehrere Tasten rufen denselben externen Befehl mit
    # unterschiedlichem Argument auf" - braucht KEINEN eigenen Action-Type,
    # der ganz normale 'open'-Typ reicht (siehe SEITEN-LOGIK.md Abschnitt
    # 4.2). Hier als Farbschema-Umschalter, genauso gut fuer z.B. einen
    # eigenen Desktop-Theme-Switcher, unterschiedliche Monitor-Layouts o.ae. -
    # eigenes Skript schreiben, das den gewuenschten Zustand anhand des
    # uebergebenen Arguments setzt, dann pro Option eine Taste mit demselben
    # Skript-Pfad aber anderem Argument.
    farbschema:
      color: '#94A3B8'
      pages:
      - name: Farbschema
        keys:
          0:
            name: Hell
            title: Hell
            action:
              type: open
              linux_command: /home/DEINNAME/skripte/farbschema-setzen hell
            icon:
              type: generated
          1:
            name: Dunkel
            title: Dunkel
            action:
              type: open
              linux_command: /home/DEINNAME/skripte/farbschema-setzen dunkel
            icon:
              type: generated
          2:
            name: Kontrast
            title: Kontrast
            action:
              type: open
              linux_command: /home/DEINNAME/skripte/farbschema-setzen kontrast
            icon:
              type: generated
    # Kochrezept "Fenster-Layout-Seite" - siehe SEITEN-LOGIK.md Abschnitt 4.14.
    unterricht:
      color: '#7C3AED'
      pages:
      - name: Unterricht
        keys:
          0:
            name: Start
            title: Start
            action: {type: layout_start, layout: unterricht}
            icon: {type: generated}
          1:
            name: Browser links
            title: Browser L
            action: {type: layout_focus, app: browser_links, layout: unterricht}
            icon: {type: generated}
          2:
            name: Browser rechts
            title: Browser R
            action: {type: layout_focus, app: browser_rechts, layout: unterricht}
            icon: {type: generated}
          3:
            name: Chat
            title: Chat
            action: {type: layout_focus, app: chat, layout: unterricht}
            icon: {type: generated}
          5:
            name: Bilder
            title: Bilder
            action: {type: layout_focus, app: bilder, layout: unterricht}
            icon: {type: generated}
          6:
            name: PDF
            title: PDF
            action: {type: layout_focus, app: pdf, layout: unterricht}
            icon: {type: generated}
          10:
            name: Zurueck blaettern
            title: Zurueck
            action: {type: layout_page, direction: prev, layout: unterricht}
            icon: {type: generated}
          11:
            name: Vor blaettern
            title: Weiter
            action: {type: layout_page, direction: next, layout: unterricht}
            icon: {type: generated}
          12:
            name: Maximieren
            title: Gross/Klein
            action: {type: layout_maximize, layout: unterricht}
            icon: {type: generated}
          13:
            name: Anordnen
            title: Anordnen
            action: {type: layout_arrange, layout: unterricht}
            icon: {type: generated}
