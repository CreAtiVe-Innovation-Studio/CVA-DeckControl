[pytest]
testpaths = tests
# Ohne das findet "import streamdeck_driver" in den Tests nur bei
# `python -m pytest` (fuegt automatisch das Arbeitsverzeichnis zu sys.path
# hinzu) - beim blossen `pytest`-Kommando (z.B. in CI) NICHT, das ist genau
# so in GitHub Actions gescheitert (ModuleNotFoundError). pythonpath macht
# das unabhaengig vom Aufruf-Stil explizit.
pythonpath = .
